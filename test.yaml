# 確認すること
# - 外部ツールのバージョンコマンドを呼び出せること
# - Neovimと各言語サーバの疎通
# - NeovimからTree-sitterパーサを利用できること

# 確認しないこと
# - Neovimキーバインド
# - Neovimプラグイン

schemaVersion: "2.0.0"

containerRunOptions:
  user: "1000"

commandTests:
  - name: "CA certificates are readable"
    command: "test"
    args:
      - "-s"
      - "/etc/ssl/certs/ca-certificates.crt"

  - name: "Git starts"
    command: "git"
    args:
      - "--version"

  - name: "ripgrep starts"
    command: "rg"
    args:
      - "--version"

  - name: "Neovim starts"
    command: "nvim"
    args:
      - "--headless"
      - "+qa"
    excludedOutput: [".+"]
    excludedError: [".+"] 

  # Language Servers
  - name: "markdown-oxide starts"
    command: "/usr/local/lib/nvim/lsp/markdown-oxide"
    args:
      - "--version"

  - name: "Neovim recognizes markdown-oxide"
    command: "nvim"
    args:
      - "--headless"
      - "+edit test.md"
      - "+sleep 5"
      - "+lua print(#vim.lsp.get_clients({name='markdown_oxide'}) > 0 and 'OK' or 'NG')"
      - "+qa"
    expectedError: ["OK"]

  # Tree-sitter Parsers
  # diff は見つからなかったためとりあえず検証スキップ
  - name: "Tree-sitter parsers load"
    command: "nvim"
    args:
      - "--headless"
      - "+lua print(vim.inspect(vim.tbl_map(function(p) return vim.fn.fnamemodify(p, ':t:r') end, vim.api.nvim_get_runtime_file('parser/*', true))))"
      - "+qa"
    expectedError:
      - "\"bash\""
      - "\"c\""
      - "\"capnp\""
      - "\"cmake\""
      - "\"cpp\""
      - "\"css\""
      - "\"csv\""
      - "\"dart\""
      - "\"dockerfile\""
      - "\"gitcommit\""
      - "\"haskell\""
      - "\"html\""
      - "\"javascript\""
      - "\"json\""
      - "\"json5\""
      - "\"just\""
      - "\"lua\""
      - "\"luadoc\""
      - "\"make\""
      - "\"markdown\""
      - "\"markdown_inline\""
      - "\"python\""
      - "\"regex\""
      - "\"rust\""
      - "\"toml\""
      - "\"tsx\""
      - "\"typescript\""
      - "\"vim\""
      - "\"vimdoc\""
      - "\"yaml\""
