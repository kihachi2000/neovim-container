name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: bash -n bin/nvim

      - name: Build Docker image
        run: docker build --tag neovim-container:ci .

      - name: Smoke test Neovim
        run: docker run --rm neovim-container:ci --headless '+qa'
