[tasks.ci]
description = "Build and smoke test the Docker image"
run = """
  set -e
  docker build --tag neovim-container:ci .
  trap 'docker image rm neovim-container:ci' EXIT
  docker run --rm --entrypoint test neovim-container:ci -s /etc/ssl/certs/ca-certificates.crt
  docker run --rm --entrypoint test neovim-container:ci -f /tmp/nvim-home/.config/nvim/init.lua
  docker run --rm neovim-container:ci -u NONE --headless '+lua assert(vim.fn.stdpath("config") == "/tmp/nvim-home/.config/nvim")' '+qa'
  docker run --rm -e HOME=/tmp/alternate-home -e XDG_CONFIG_HOME=/tmp/nvim-home/.config neovim-container:ci -u NONE --headless '+lua assert(vim.fn.stdpath("config") == "/tmp/nvim-home/.config/nvim")' '+qa'
  docker run --rm neovim-container:ci --headless '+qa'
  docker run --rm neovim-container:ci --version
  docker run --rm --entrypoint rg neovim-container:ci --version
  docker run --rm -u "$(id -u):$(id -g)" neovim-container:ci --headless '+qa'
  echo "CI completed successfully."
"""
