[tasks.ci]
description = "Build and smoke test the Docker image"
run = """
  set -e
  docker build --tag neovim-container:ci .
  trap 'docker image rm neovim-container:ci' EXIT
  docker run --rm --entrypoint test neovim-container:ci -s /etc/ssl/certs/ca-certificates.crt
  docker run --rm neovim-container:ci --headless '+qa'
  docker run --rm neovim-container:ci --headless \
    '+sleep 10' \
    '+lua local msgs = vim.api.nvim_exec2("messages", { output = true }).output; assert(msgs:match("^%s*$"), msgs)' \
    '+qa'
  docker run --rm --entrypoint git neovim-container:ci --version
  docker run --rm --entrypoint rg neovim-container:ci --version
  docker run --rm --entrypoint /usr/local/lib/nvim/lsp/markdown-oxide neovim-container:ci --version
  docker run --rm --entrypoint sh neovim-container:ci -eu -c '
    workdir="$(mktemp -d)"
    trap "rm -rf ${workdir}" EXIT
    touch "${workdir}/.moxide.toml"
    printf "# markdown-oxide test\n" > "${workdir}/test.md"
    nvim --headless "${workdir}/test.md" \
      "+lua assert(vim.wait(5000, function() return #vim.lsp.get_clients({ name = \"markdown_oxide\", bufnr = 0 }) > 0 end, 100), \"markdown_oxide did not attach\")" \
      "+qa"
  '
  docker run --rm --entrypoint sh neovim-container:ci -eu -c '
    workdir="$(mktemp -d)"
    trap "rm -rf ${workdir}" EXIT
    cat <<'"'"'EOF'"'"' > "${workdir}/table.md"
|name|value|
|:--|--:|
|foo|1|
|longer text|22|
EOF
    nvim --headless "${workdir}/table.md" \
      "+lua vim.api.nvim_win_set_cursor(0, { 2, 0 })" \
      "+lua assert(require(\"plugins.format-md-table\").format_table_under_cursor(), \"markdown table was not detected\")" \
      "+lua local expected = { \"| name        | value |\", \"| :---------- | ----: |\", \"| foo         | 1     |\", \"| longer text | 22    |\" }; local actual = vim.api.nvim_buf_get_lines(0, 0, -1, false); assert(vim.deep_equal(actual, expected), vim.inspect(actual))" \
      "+qa"
  '
  docker run --rm --entrypoint sh neovim-container:ci -eu -c '
    parsers="
      bash capnp cmake cpp css csv dart dockerfile gitcommit haskell html
      javascript json json5 just luadoc make python regex rust toml tsx
      typescript yaml
      c diff lua markdown markdown_inline vimscript vimdoc
    "
    for parser in ${parsers}; do
      nvim --headless -u NONE \
        -c "lua assert(vim.treesitter.language.add('${parser}'))" \
        -c "qa"
    done
  '
  echo "CI completed successfully."
"""
