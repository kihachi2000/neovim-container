[tasks.test]
description = "Build and smoke test the Docker image"
run = """
  set -e
  docker build --tag neovim-container:ci .
  trap 'docker image rm neovim-container:ci' EXIT
  docker run --rm \
    -v /var/run/docker.sock:/var/run/docker.sock \
    -v "${PWD}/test.yaml:/test.yaml:ro" \
    gcr.io/gcp-runtimes/container-structure-test \
    test --image neovim-container:ci --config /test.yaml
  echo "CI completed successfully."
"""
